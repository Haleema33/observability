replicaCount: 1

image:
  repository: grafana/loki
  tag: "2.9.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3100

config:
  auth_enabled: false
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
  
  common:
    path_prefix: /tmp/loki
    storage:
      filesystem:
        chunks_directory: /tmp/loki/chunks
        rules_directory: /tmp/loki/rules
    replication_factor: 1
    ring:
      instance_addr: 127.0.0.1
      kvstore:
        store: inmemory
  
  schema_config:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
  
  ruler:
    alertmanager_url: http://localhost:9093
  
  analytics:
    reporting_enabled: false

persistence:
  enabled: false  # Using emptyDir for simplicity

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  runAsNonRoot: false
  runAsUser: 0

nodeSelector: {}
tolerations: []
affinity: {}