# IMPORTANT CUSTOMIZATION VALUES:
# - config.clients: Loki endpoint configuration
# - config.scrape_configs: What logs to collect and how
# - daemonset.enabled: Run on all nodes vs specific deployment
# - volumes: Additional log paths to mount

image:
  repository: grafana/promtail
  tag: "2.9.0"
  pullPolicy: IfNotPresent

# IMPORTANT: Run as DaemonSet to collect logs from all nodes
daemonset:
  enabled: true

service:
  type: ClusterIP
  port: 3101

# IMPORTANT: Configure Loki endpoint and scraping rules
config:
  server:
    http_listen_port: 3101
  
  # IMPORTANT: Point to your Loki instance
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  
  positions:
    filename: /tmp/positions.yaml
  
  # IMPORTANT: Configure what logs to scrape
  scrape_configs:
    # Kubernetes pod logs
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      pipeline_stages:
        - cri: {}
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_pod_controller_name
          regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
          action: replace
          target_label: __tmp_controller_name
        - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_app
            - __tmp_controller_name
            - __meta_kubernetes_pod_name
          regex: ^;*([^;]+)(;.*)?$
          action: replace
          target_label: app
        - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_instance
            - __meta_kubernetes_pod_label_release
          regex: ^;*([^;]+)(;.*)?$
          action: replace
          target_label: instance
        - source_labels:
            - __meta_kubernetes_pod_name
          action: replace
          target_label: pod
        - source_labels:
            - __meta_kubernetes_namespace_name
          action: replace
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_pod_container_name
          action: replace
          target_label: container
        - replacement: /var/log/pods/*/*/*.log #/var/log/pods/*$1/*.log
          separator: /
          source_labels:
            - __meta_kubernetes_pod_uid
            - __meta_kubernetes_pod_container_name
          target_label: __path__
    
      # System logs
    - job_name: system-logs
      static_configs:
        - targets:
            - localhost
          labels:
            job: system-logs
            __path__: /var/log/host/containers/*.log

# Volume mounts for log collection
volumes:
  # Kubernetes logs
  - name: pods
    hostPath:
      path: /var/log/pods
  - name: containers
    hostPath:
      path: /var/lib/docker/containers
  # System logs
  - name: system-logs
    hostPath:
      path: /var/log

volumeMounts:
  - name: pods
    mountPath: /var/log/pods
    readOnly: true
  - name: containers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: system-logs
    mountPath: /var/log/host
    readOnly: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Security context for accessing logs
securityContext:
  runAsUser: 0
  runAsGroup: 0
  privileged: true

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

nodeSelector: {}
tolerations:
  - effect: NoSchedule
    operator: Exists
affinity: {}